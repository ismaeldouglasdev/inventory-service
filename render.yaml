services:
  - type: web
    name: loja-online
    runtime: docker
    repo: https://github.com/ismaeldouglasdev/inventory-service
    branch: sync/prod-data
    plan: free
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: CDC_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: loja-images
      - key: R2_PUBLIC_URL
        value: ""
